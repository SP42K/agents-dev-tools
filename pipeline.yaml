# milestone-pipeline 設定檔
# 模型可自由抽換:alias(fable / opus / sonnet / haiku)或完整 model id 皆可

repo:
  path: /path/to/your/repo        # 本機 repo 路徑(orchestrator 的工作目錄)
  base_branch: main
  remote: origin

plan:
  path: plan.md                   # 相對 repo path,或絕對路徑

implementer:
  model: fable                    # 實作 + 修復(同一個持久 session)
  permission_mode: acceptEdits    # 全自動可改 bypassPermissions(建議只在隔離環境)
  max_turns: 80                   # 單次 query 的 agentic loop 上限
  max_budget_usd: 10.0            # 每個 milestone 的 implementer session 花費上限

reviewer:
  type: script                    # script  = 純 SDK 版
                                  # actions = 輪詢 GitHub Actions 上的 review
                                  # hybrid  = ocr delegate 先確定性地算出「該審哪些檔、
                                  #           每個檔套哪組檢查項目」,再交給 Claude
                                  #           讀 diff / 跑測試 / 驗規格 / 下 verdict
  model: opus                     # 每輪 review 都是 fresh session
  permission_mode: default        # reviewer 只有唯讀工具,不需要 acceptEdits
  max_turns: 40
  max_budget_usd: 3.0             # 每輪 review 花費上限
  # type: actions 時使用:
  poll_interval_sec: 60
  poll_timeout_sec: 1800

  # -- type: hybrid 時使用 -----------------------------------------------
  # 前置條件只有一個:npm i -g @alibaba-group/open-code-review
  # 走的是 `ocr delegate`(委託模式),**不需要 OCR 自己的 LLM 金鑰** ——
  # 它只做檔案篩選與規則比對,review 由 reviewer 的 Claude session 執行,
  # 所以訂閱制的 Claude 也跑得動,而且不會有第二筆帳單。
  # 沒裝 ocr 也不會擋流程:那段是 fail-open,跑不起來只記警告並退回純 Claude。
  ocr_exe: ocr                    # 執行檔名稱或完整路徑
  ocr_timeout_sec: 300            # 單次 ocr 行程的上限
  ocr_exclude: ""                 # ocr --exclude,逗號分隔的 gitignore 樣式
  ocr_rule_path: ""               # ocr --rule 的自訂規則 JSON
  ocr_max_rule_chars: 40000       # 塞進 prompt 的規則字數上限,超過會截斷並註明

loop:
  max_review_rounds: 5            # review ↔ fix 最多來回幾輪,超過即停下等人介入
  compact_between_rounds: true    # 每輪 fix 後對 implementer session 下 /compact
  merge_method: squash            # squash | merge | rebase

  # -- 人工決策關卡 ------------------------------------------------------
  # 停下來時走 park & notify:存檔 → 通知 → 退出(exit 1),
  # 人再用 approve / reject 恢復,不會 block 住整晚的無人值守跑。
  merge_gate: auto                # auto = 直接 merge;ask = merge 前等人放行
  merge_gate_from_milestone: 1    # merge_gate=ask 時,第幾個 milestone 起才要問
                                  # (骨架期可全自動,越後面越該人看一眼)
  gate_on_unresolved: true        # implementer 自陳與 reviewer 有爭點時停下來問人
  gate_on_agent_error: true       # agent 超預算/超輪數/API 失敗時停下來問人,
                                  # 而不是直接中止(session 保留,加額度後可續跑)

  # -- 確定性驗收關卡 ----------------------------------------------------
  # reviewer APPROVE 之後、merge 之前跑的命令(在目標 repo 的 PR 分支上)。
  # reviewer 的 VERDICT 是 LLM 的判斷,這一道是 code 驗出來的事實。
  # 走 shell,所以 `pytest && ruff check .` 這種寫法可以。
  # 空字串 = 不跑(預設,維持沒有這個功能時的行為)。
  # 失敗時把輸出當成這一輪的意見交回 implementer,共用 max_review_rounds,
  # 輪數用完就落到既有的 stuck —— 不會無限重試。
  verify_command: ""              # 例如:pytest -q
  verify_timeout_sec: 900

notify:
  channels: []                    # pr_comment | webhook | desktop | telegram,可多選;空 = 不通知
  mention: ""                     # 例如 "@SP42K",放在通知開頭觸發 GitHub 推播
  webhook_url: ""                 # Discord / Slack incoming webhook(選 webhook 時必填)
  webhook_format: discord         # discord | slack | raw
  # telegram:兩個都留空就吃環境變數 TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID ——
  # 這個檔常跟 plan 一起放在目標 repo 裡,寫進來就有被 commit 出去的一天。
  # token 是密鑰;chat_id 不是,但它是永久的個人識別碼,一樣不該進 git 歷史。
  # 任一個兩邊都沒有時只記警告、不送 telegram(不擋起飛 —— 通知是旁路)。
  telegram_token: ""
  telegram_chat_id: ""            # 私訊給自己就是自己的 user id

backend: claude                   # 兩個 agent 跑在哪個 runtime 上(見 backend.py)。
                                  # 目前只有 claude 一種,這行不寫也是它。

state_file: .pipeline-state.json  # 進度存檔(相對 repo path),crash 後可 resume
