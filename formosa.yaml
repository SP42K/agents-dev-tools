# milestone-pipeline 設定:formosa-mcp(W3 起)
#
# ** 這條 pipeline 跑在 mac 上(`ssh mac`),不是本機 Windows。**
# M6 起搬過去的:兩台的環境都備齊了(python / node / gh / ocr / claude),
# 但 implementer 的 session_id 綁在跑它那台的 ~/.claude/projects/ 底下,
# **不能跨機器 resume** —— 所以起跑之後就固定在 mac 上跑完,不要兩邊交替。
#
#   ssh mac 'cd ~/Documents/agents-dev-tools && \
#     nohup .venv/bin/python -m milestone_pipeline run --config formosa.yaml \
#       >> ~/pipeline-formosa.log 2>&1 < /dev/null & echo $! > ~/pipeline-formosa.pid'
#
#   ssh mac tail -n 50 ~/pipeline-formosa.log          # 隨時回來看
#   ssh mac 'kill $(cat ~/pipeline-formosa.pid)'       # 中途叫停(見 SKILL.md §8)
#   ssh mac 'cd ~/Documents/agents-dev-tools && .venv/bin/python -m milestone_pipeline status --config formosa.yaml'
#
# `< /dev/null` 不能省:少了它 ssh 會等 stdin 而不返回。
# 改完這個檔要先 push + 在 mac 上 pull,否則跑的是舊設定。
#
# 開跑前的前置條件(缺一個就會在半路才炸):
#   1. .env 裡有 CWA_API_KEY / TDX_CLIENT_ID / TDX_CLIENT_SECRET
#   2. ssh-agent 有 key —— remote 是 git@github.com,orchestrator 自己會 fetch/pull
#   3. gh auth status 正常
#   4. formosa-mcp 的 master 是乾淨的(orchestrator 開工前會 checkout + pull)

repo:
  # `~` 展開,所以同一份 config 在 Windows 與 mac 上都指得到
  # (兩台的 repo 都在 `<家目錄>/Documents/formosa-mcp`)。
  path: ~/Documents/formosa-mcp
  base_branch: master             # 不是預設的 main
  remote: origin

plan:
  path: docs/pipeline-plan.md     # 不是 docs/plan.md —— 那份是產品計畫書,
                                  # 用 `## ` 切會得到 9 個假 milestone

implementer:
  # 兩邊都用 opus。注意 milestone 1 的 session 是用 fable 開的,resume 時換模型
  # 是否生效沒有驗證過;milestone 2 起才是乾淨的 opus session。
  # 另外 opus 比 fable 貴,下面的 max_budget_usd 會消耗得更快。
  model: opus
  permission_mode: acceptEdits
  # 實測:opus 跑 W4(七個 tool + OAuth + 14 份真實錄製)在 120 turns 用盡時
  # 程式全寫完了,卡在 commit / push / 開 PR 之前。W3 用 fable 時 120 夠用。
  max_turns: 200
  # 實測:W3 光是實作階段就吃掉 $15(39 個檔案、+7275 行),第 1 輪修復開始
  # 沒多久就撞頂。resume 的是同一個 session,SDK 的 total_cost_usd 是累計值,
  # 所以續跑前一定要把上限拉高,否則會立刻再 park。
  max_budget_usd: 40.0

reviewer:
  # M5 起改用 hybrid(`ocr delegate`)做對照:先確定性地算出「該審哪些檔、每個檔套
  # 哪組檢查項目」,再交給 Claude 讀 diff / 跑測試 / 下 verdict。不需要額外金鑰、
  # 不會有第二筆帳單。M1–M4 跑的都是 script,所以這一輪的 review 意見值得跟舊的比。
  # 注意這段是 fail-open:ocr 沒裝 / 逾時 / JSON 壞掉只記警告,起飛後看一次 log
  # 有沒有那行警告,否則「OCR 悄悄沒在跑」不會有人發現。
  type: hybrid
  model: opus
  permission_mode: default        # 唯讀工具,不需要 acceptEdits
  # 實測(M5 第 2 輪,hybrid):40 輪不夠 —— script 版跑 M1–M4 都沒撞過,
  # hybrid 會多拿一份 11 檔的待審清單,每個檔都去讀 = 輪數直接翻倍。
  # 換 hybrid 的話這個值一定要跟著調。
  max_turns: 100
  # 第 1 輪 review 就用掉 $2.05(要讀完 39 個檔案的 diff),$3 的餘裕太薄,
  # reviewer 撞頂一樣會 park。輪數拉到 100 之後跟著往上,免得換撞第二道天花板。
  max_budget_usd: 8.0

loop:
  # 5 → 7:M5 光是 review 就用掉 4 輪,而 verify_command 失敗時**共用同一組輪數**,
  # 不加的話驗收失敗一兩次就落到 stuck 要人工 retry。
  max_review_rounds: 7
  compact_between_rounds: true
  merge_method: merge             # 對齊 repo 既有慣例(PR #1~#4 都是 merge commit)

  # 每個 milestone 都是第一次接新上游(CWA / TDX / Workers / npm),
  # W2 的教訓是 fixture 會跟著實作一起錯 —— 人在 merge 前看一眼真實回應最便宜。
  merge_gate: ask
  merge_gate_from_milestone: 1

  # M6 起開:reviewer 的「全綠」是 LLM 說它跑過,這一道是 code 跑出來的事實。
  # 走 shell(cmd.exe)所以 `&&` 可以;M5 merge 後實測整串約 30 秒,900s 綽綽有餘。
  # 注意 `approve` 會繞過這道關卡(人已裁決),要重驗得用 `reject`。
  verify_command: "npm run lint && npm run typecheck && npm test"
  verify_timeout_sec: 900
  gate_on_unresolved: true
  gate_on_agent_error: true

notify:
  # park 之後 orchestrator 會 exit,沒通知就不會知道它停了。
  # desktop = 人在電腦前最即時;pr_comment = 決策紀錄留在 PR 上事後可追,
  # 且 @mention 會走 GitHub 推播(人不在電腦前時的補位);
  # telegram = 人不在電腦前也收得到,無人值守跑時唯一真的會被看到的那個。
  channels: [desktop, pr_comment, telegram]
  mention: "@SP42K"
  webhook_url: ""
  webhook_format: discord
  # 兩個都不進版控(這個 repo 是公開的):留空,吃環境變數
  # TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID。token 是密鑰,chat id 是永久的
  # 個人識別碼 —— 都不該進 git 歷史。任一個沒設就只記警告、不擋起飛。
  telegram_token: ""
  telegram_chat_id: ""

state_file: .pipeline-state.json  # 寫進 formosa-mcp/,已加進該 repo 的 .gitignore
